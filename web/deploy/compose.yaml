services:
  comaps-photon-web:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    container_name: comaps-photon-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
networks:
  web:
    external: true
    name: homeserver-web
