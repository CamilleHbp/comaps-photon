server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /sw.js { add_header Cache-Control "no-cache, no-store"; add_header Service-Worker-Allowed "/"; }
}
