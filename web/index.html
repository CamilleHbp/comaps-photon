<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#315c45"><meta name="description" content="Explore the map, find places with Photon, and keep your favourites close."><link rel="icon" href="/icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><title>CoMaps · Photon</title></head>
<body>
<main id="app">
  <section id="map" aria-label="Map"></section>
  <aside class="panel" aria-label="Explore">
    <header class="brand"><img src="/icons/icon.svg" width="38" height="38" alt=""><div><h1>CoMaps<span> / Photon</span></h1><p data-i18n="tagline"></p></div><button id="settings-toggle" class="icon-button" aria-controls="settings" aria-expanded="false" data-label="settings"><i data-lucide="settings-2"></i></button></header>
    <form id="search-form" role="search"><label for="query" class="sr-only" data-i18n="searchLabel"></label><div class="search-box"><i data-lucide="search"></i><input id="query" type="search" autocomplete="off" maxlength="200" data-placeholder="searchPlaceholder"><button type="submit" class="icon-button search-submit" data-label="search"><i data-lucide="arrow-right"></i></button></div></form>
    <nav class="tabs" aria-label="Places"><button id="explore-tab" class="active" aria-pressed="true"><i data-lucide="compass"></i><span data-i18n="explore"></span></button><button id="saved-tab" aria-pressed="false"><i data-lucide="bookmark"></i><span data-i18n="saved"></span><span id="saved-count">0</span></button></nav>
    <section id="settings" hidden><h2 data-i18n="settings"></h2><label for="language" data-i18n="language"></label><select id="language"><option value="auto" data-i18n="automatic"></option><option value="en">English</option><option value="fr">Français</option></select><h3 data-i18n="about"></h3><p data-i18n="aboutText"></p><p data-i18n="privacy"></p><p data-i18n="offlineInfo"></p><button id="install" class="primary" data-i18n="install"></button><p id="install-help" data-i18n="installHelp"></p><a href="https://www.comaps.app/" target="_blank" rel="noopener" data-i18n="nativeInfo"></a></section>
    <section id="browse"><div id="intro"><h2 data-i18n="introTitle"></h2><p data-i18n="introText"></p><div class="suggestions"><button data-query="coffee"><i data-lucide="coffee"></i><span data-i18n="coffee"></span></button><button data-query="parks"><i data-lucide="trees"></i><span data-i18n="parks"></span></button><button data-query="food"><i data-lucide="utensils"></i><span data-i18n="food"></span></button></div><div class="hint"><i data-lucide="map-pin"></i><p data-i18n="mapHint"></p></div></div><div id="results-header" hidden><h2 id="results-title"></h2><button id="clear" class="text-button" data-i18n="clear"></button></div><p id="status" role="status" aria-live="polite"></p><ol id="results"></ol></section>
    <section id="place" hidden aria-label="Place details"></section>
    <footer class="panel-footer"><span class="connection"><span id="connection-dot"></span><span id="connection-text"></span></span><a href="https://github.com/komoot/photon" target="_blank" rel="noopener">Photon</a><span>·</span><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></footer>
  </aside>
  <div class="map-tools"><button id="locate" class="icon-button" data-label="locate"><i data-lucide="locate-fixed"></i></button><div class="zoom"><button id="zoom-in" class="icon-button" data-label="zoomIn"><i data-lucide="plus"></i></button><button id="zoom-out" class="icon-button" data-label="zoomOut"><i data-lucide="minus"></i></button></div></div>
  <div id="offline-banner" hidden data-i18n="offlineBanner"></div><div id="toast" role="status" hidden></div>
</main><script type="module" src="/src/main.js"></script></body></html>
